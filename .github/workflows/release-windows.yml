name: Build and Release Windows Installer

on:
  pull_request:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/release-windows.yml"
      - "MusiqueHockey/MusiqueHockey/MusiqueHockey.csproj"
      - "publish-windows.ps1"
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/release-windows.yml"
      - "MusiqueHockey/MusiqueHockey/MusiqueHockey.csproj"
      - "publish-windows.ps1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $project = "MusiqueHockey/MusiqueHockey/MusiqueHockey.csproj"
          $match = Select-String -Path $project -Pattern '<Version>([^<]+)</Version>'
          if (-not $match) { throw "Version introuvable dans $project" }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish MusiqueHockey/MusiqueHockey/MusiqueHockey.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output dist/windows-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }

          & $compiler "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\ArenaDJ.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "dist\installer\ArenaDJ-Setup.exe")) {
            throw "ArenaDJ-Setup.exe n'a pas été créé."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaDJ-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/ArenaDJ-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $asset = "dist\installer\ArenaDJ-Setup.exe"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La release $tag existe déjà. Aucun remplacement automatique."
            exit 0
          }

          gh release create $tag $asset `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Aréna DJ $version" `
            --notes "Installateur Windows 64 bits d'Aréna DJ $version. Téléchargez ArenaDJ-Setup.exe puis lancez-le pour installer l'application."

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
