name: Build and Release Windows Installer

on:
  pull_request:
    branches: [main]
    paths:
      - "MusiqueHockey/MusiqueHockey/**"
      - "installer/**"
      - ".github/workflows/release-windows.yml"
      - "publish-windows.ps1"
  push:
    branches: [main]
    paths:
      - "MusiqueHockey/MusiqueHockey/**"
      - "installer/**"
      - ".github/workflows/release-windows.yml"
      - "publish-windows.ps1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $project = "MusiqueHockey/MusiqueHockey/MusiqueHockey.csproj"
          $match = Select-String -Path $project -Pattern '<Version>([^<]+)</Version>'
          if (-not $match) { throw "Version introuvable dans $project" }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Publish complete self-contained application
        shell: pwsh
        run: .\publish-windows.ps1

      - name: Verify published runtime and dependencies
        shell: pwsh
        run: |
          $root = "dist\windows-x64"
          $required = @(
            "MusiqueHockey.exe",
            "MusiqueHockey.dll",
            "MusiqueHockey.deps.json",
            "MusiqueHockey.runtimeconfig.json",
            "coreclr.dll",
            "hostfxr.dll",
            "NAudio.dll",
            "Npgsql.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $root $file))) {
              throw "Dépendance manquante : $file"
            }
          }

          $categories = @("all", "entracte", "finGame", "PPLocal", "PPvis", "buts", "warmup")
          foreach ($category in $categories) {
            if (-not (Test-Path (Join-Path $root "netX\musiques\$category"))) {
              throw "Dossier musical manquant : $category"
            }
          }

          $size = (Get-ChildItem $root -File -Recurse | Measure-Object Length -Sum).Sum
          if ($size -lt 50MB) {
            throw "La publication semble incomplète : seulement $([math]::Round($size / 1MB, 1)) Mo."
          }
          Write-Host "Publication autonome validée : $([math]::Round($size / 1MB, 1)) Mo."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }

          & $compiler "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\ArenaDJ.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "dist\installer\ArenaDJ-Setup.exe")) {
            throw "ArenaDJ-Setup.exe n'a pas été créé."
          }

      - name: Test installer on clean folder
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "ArenaDJ-Smoke"
          if (Test-Path $testDir) {
            Remove-Item $testDir -Recurse -Force
          }

          $installer = (Resolve-Path "dist\installer\ArenaDJ-Setup.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/TASKS=",
            "/DIR=$testDir"
          ) -Wait -PassThru

          if ($install.ExitCode -ne 0) {
            throw "L'installateur a retourné le code $($install.ExitCode)."
          }

          $requiredInstalled = @(
            "MusiqueHockey.exe",
            "MusiqueHockey.dll",
            "MusiqueHockey.runtimeconfig.json",
            "coreclr.dll",
            "hostfxr.dll",
            "NAudio.dll",
            "Npgsql.dll"
          )

          foreach ($file in $requiredInstalled) {
            if (-not (Test-Path (Join-Path $testDir $file))) {
              throw "Installation incomplète : $file est absent."
            }
          }

          $exe = Join-Path $testDir "MusiqueHockey.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory $testDir -PassThru
          Start-Sleep -Seconds 7

          if ($process.HasExited) {
            throw "Aréna DJ s'est fermé pendant le test de démarrage (code $($process.ExitCode))."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Installation et démarrage validés sur Windows."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaDJ-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/ArenaDJ-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $asset = "dist\installer\ArenaDJ-Setup.exe"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La release $tag existe déjà. Aucun remplacement automatique."
            exit 0
          }

          gh release create $tag $asset `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Aréna DJ $version" `
            --notes "Installateur Windows 64 bits autonome d'Aréna DJ $version. Le runtime .NET 8, les bibliothèques audio/base de données et tous les fichiers logiciels requis sont inclus. Téléchargez ArenaDJ-Setup.exe et lancez-le directement."

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
